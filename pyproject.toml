[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "deadlock-detector"
version = "1.0.0"
description = "Distributed deadlock detection over resource-allocation logs with Apache Spark"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pyspark==3.4.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "networkx>=3.1", "matplotlib>=3.7"]
baseline = ["networkx>=3.1"]

[project.scripts]
deadlock-detector = "deadlock_detector.cli:main"
deadlock-detector-baseline = "deadlock_detector.baseline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
